  <style>
    /* CSS: Estilos modernos y responsivos */
    :root {
      --primary: #1f4e78;
      --secondary: #2f5597;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #d9d9d9;
      --accent: #28a745;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background-color: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 25px;
    }

   

    /* Panel de Búsqueda y Filtros */
    .search-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #dcdfe6;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-group label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--primary);
    }

    .filter-group input,
    .filter-group select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--secondary);
    }

    .btn-reset {
      grid-column: 1 / -1;
      padding: 10px;
      background-color: var(--secondary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset:hover {
      background-color: var(--primary);
    }

    .status-bar {
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tabla de Resultados */
    .table-container {
      overflow-x: auto;
      max-height: 600px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: var(--secondary);
      color: white;
      padding: 12px;
      font-size: 0.95rem;
      z-index: 2;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    tbody tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    tbody tr:hover {
      background-color: #e8f0fe;
    }

    .badge-id {
      background-color: var(--primary);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      font-size: 0.95rem;
    }

    .no-results {
      text-align: center;
      padding: 30px;
      color: #888;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .container { padding: 15px; }
      header h1 { font-size: 1.2rem; }
    }
  </style>
</head>

    // Renderizar Tabla
    const tableBody = document.getElementById('tableBody');
    const countDisplay = document.getElementById('countDisplay');

    function renderTable(data) {
      tableBody.innerHTML = '';
      countDisplay.textContent = data.length;

      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="3" class="no-results">No se encontraron resultados para la búsqueda.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.sector}</td>
          <td style="text-align: center;"><span class="badge-id">${item.id}</span></td>
          <td>${item.motivo || '<i style="color:#aaa;">(En blanco)</i>'}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Filtrar Datos en tiempo real
    function filterData() {
      const genVal = document.getElementById('searchGeneral').value.toLowerCase().trim();
      const secVal = document.getElementById('searchSector').value;
      const idVal = document.getElementById('searchID').value.trim();
      const motVal = document.getElementById('searchMotivo').value.toLowerCase().trim();

      const filtered = paradasData.filter(item => {
        const matchGen = genVal === '' || 
          item.sector.toLowerCase().includes(genVal) || 
          item.id.toString().includes(genVal) || 
          item.motivo.toLowerCase().includes(genVal);

        const matchSec = secVal === '' || item.sector === secVal;
        const matchID = idVal === '' || item.id.toString().includes(idVal);
        const matchMot = motVal === '' || item.motivo.toLowerCase().includes(motVal);

        return matchGen && matchSec && matchID && matchMot;
      });

      renderTable(filtered);
    }

    // Resetear Filtros
    function resetFilters() {
      document.getElementById('searchGeneral').value = '';
      document.getElementById('searchSector').value = '';
      document.getElementById('searchID').value = '';
      document.getElementById('searchMotivo').value = '';
      renderTable(paradasData);
    }

    // Event Listeners
    document.getElementById('searchGeneral').addEventListener('input', filterData);
    document.getElementById('searchSector').addEventListener('change', filterData);
    document.getElementById('searchID').addEventListener('input', filterData);
    document.getElementById('searchMotivo').addEventListener('input', filterData);

    // Carga Inicial
    renderTable(paradasData);
  </script>
